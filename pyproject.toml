[build-system]
# PyYAML is a build-time dependency only: hatch_build.py uses it to convert the
# spec submodule's YAML into the JSON shipped as package data. The installed
# emulator parses no YAML, so it stays free of runtime dependencies.
requires = ["hatchling>=1.32.4", "pyyaml>=6.0.3"]
build-backend = "hatchling.build"

[project]
name = "meter-driver-emulator"
version = "0.1.0"
description = "Pure-Python emulator of the Meter Driver Specification for development without meter hardware"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Deliberately empty: the emulator runs on the standard library alone, so a
# developer can start it with nothing but a Python interpreter.
dependencies = []

[project.urls]
Specification = "https://github.com/EarthSpark/meter-driver-spec"

[project.scripts]
meter-driver-emulator = "meter_driver_emulator.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "pydocstyle>=6.3.0",
    "pre-commit>=4.6.2",
    # Both let the tests import hatch_build.py and run its conversion. The
    # build itself gets them from [build-system] requires, not from here.
    "pyyaml>=6.0.3",
    "hatchling>=1.32.4",
]

# hatch_build.py writes src/meter_driver_emulator/openapi.json before each
# build, for every target and for editable installs too.
[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/meter_driver_emulator"]
# The generated document is gitignored, so list it explicitly to include it.
artifacts = ["src/meter_driver_emulator/openapi.json"]

[tool.hatch.build.targets.sdist]
# An sdist has no submodule, so it carries the generated document and the build
# hook reuses it.
artifacts = ["src/meter_driver_emulator/openapi.json"]

[tool.ruff]
line-length = 110
# meter-driver-spec is a checkout of another repository, with its own style.
extend-exclude = ["meter-driver-spec"]

[tool.ruff.lint]
select = ["F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["meter_driver_emulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
